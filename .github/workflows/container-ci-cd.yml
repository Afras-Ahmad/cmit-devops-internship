name: Container CI/CD

on:
  push:
    branches: [main]
    paths:
      - '1) Microservice based quote generator/**'
      - '.github/workflows/container-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - '1) Microservice based quote generator/**'
      - '.github/workflows/container-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_DIR: 1) Microservice based quote generator

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python checks
        working-directory: 1) Microservice based quote generator/QuoteService
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest ruff
          ruff check --select E9,F63,F7,F82 .
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API Gateway dependencies
        working-directory: 1) Microservice based quote generator/ApiGateway
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: API Gateway tests
        working-directory: 1) Microservice based quote generator/ApiGateway
        run: yarn test
      - name: API Gateway lint
        working-directory: 1) Microservice based quote generator/ApiGateway
        run: node --check index.js
      - name: Install frontend dependencies
        working-directory: 1) Microservice based quote generator/FrontendApplication
        run: npm ci
      - name: Frontend build and tests
        working-directory: 1) Microservice based quote generator/FrontendApplication
        env:
          API_GATEWAY: http://localhost:3001
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm test
          npm run build

  build-and-scan:
    name: Build and scan ${{ matrix.service }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: quote-service
            context: ./1) Microservice based quote generator/QuoteService
            dockerfile: ./1) Microservice based quote generator/QuoteService/Dockerfile.quote
          - service: api-gateway
            context: ./1) Microservice based quote generator/ApiGateway
            dockerfile: ./1) Microservice based quote generator/ApiGateway/Dockerfile.gateway
          - service: frontend
            context: ./1) Microservice based quote generator/FrontendApplication
            dockerfile: ./1) Microservice based quote generator/FrontendApplication/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: local/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            API_GATEWAY=http://localhost:3001
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          scan-type: image
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Save scanned image
        run: |
          mkdir -p images
          docker save -o images/${{ matrix.service }}.tar local/${{ matrix.service }}:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: images/${{ matrix.service }}.tar
          retention-days: 2

  publish-to-ecr:
    name: Publish scanned images to ECR
    needs: build-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*-${{ github.sha }}
          path: images
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push scanned images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          for service in quote-service api-gateway frontend; do
            docker load --input "images/${service}.tar"
            docker tag "local/${service}:${IMAGE_TAG}" "${ECR_REGISTRY}/${service}:${IMAGE_TAG}"
            docker push "${ECR_REGISTRY}/${service}:${IMAGE_TAG}"
          done
      - name: Record published image digests
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          for service in quote-service api-gateway frontend; do
            aws ecr describe-images --repository-name "${service}" --image-ids imageTag="${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text
          done
